<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Feedback Form</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header><span>Feedback / Naman Srivastava</span></header>
  <main>
    <h1>Online Feedback Form</h1>
    <p class="intro">Share a suggestion, report an issue, or tell us what worked well.</p>
    <form action="/feedback" method="post">
      <p class="hint" id="required-note">All fields are required.</p>
      <div class="fields">
        <div><label for="name">Name</label><input id="name" name="name" autocomplete="name" maxlength="100" required></div>
        <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
        <div><label for="category">Feedback category</label><select id="category" name="category" required>
          <option value="">Choose a category</option><option>General</option><option>Suggestion</option><option>Issue</option><option>Appreciation</option>
        </select></div>
        <div><label for="rating">Rating</label><select id="rating" name="rating" required>
          <option value="">Choose a rating</option><option value="1">1 - Poor</option><option value="2">2 - Fair</option><option value="3">3 - Good</option><option value="4">4 - Very good</option><option value="5">5 - Excellent</option>
        </select></div>
        <div class="full"><label for="comments">Comments</label><textarea id="comments" name="comments" rows="5" maxlength="2000" aria-describedby="comments-help" required></textarea>
          <p id="comments-help" class="hint">Up to 2,000 characters. Please leave out sensitive information.</p>
        </div>
      </div>
      <div class="actions"><button type="submit">Submit feedback</button></div>
    </form>
    <p class="note">Lab demonstration: submissions are validated, then discarded. Nothing is saved.</p>
  </main>
</body>
</html>
